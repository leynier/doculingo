name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pyproject.toml"]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version-file: ".python-version"

      - name: Run tests
        run: |
          uv sync --all-groups --all-extras
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy doculingo
          uv run pytest -q

      - name: Get package version
        id: package-version
        run: |
          VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Check if tag exists
        id: tag-check
        run: |
          VERSION="${{ steps.package-version.outputs.version }}"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION does not exist, proceeding with release"
          fi

      - name: Generate release notes
        id: release-notes
        if: steps.tag-check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.package-version.outputs.version }}"

          # Find the most recent previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          cat > release_notes.md << 'EOF'
          ## What's Changed

          EOF

          if [ -n "$PREVIOUS_TAG" ]; then
            # Generate changelog from the last tag
            git log --pretty=tformat:"- %s (%h)" "$PREVIOUS_TAG..HEAD" >> release_notes.md
          else
            # If there are no previous tags, use the latest commits
            git log --pretty=tformat:"- %s (%h)" -10 >> release_notes.md
          fi

          # Read the content for the output
          {
            echo "notes<<EOF"
            cat release_notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build package
        if: steps.tag-check.outputs.exists == 'false'
        run: |
          echo "Building version ${{ steps.package-version.outputs.version }}..."
          uv build
          echo "✅ Package built successfully!"

      - name: Publish to PyPI
        if: steps.tag-check.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create Release
        if: steps.tag-check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package-version.outputs.version }}
          name: Release v${{ steps.package-version.outputs.version }}
          body: ${{ steps.release-notes.outputs.notes }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Success notification
        if: steps.tag-check.outputs.exists == 'false'
        run: |
          echo "🚀 Release v${{ steps.package-version.outputs.version }} completed successfully!"
          echo "📦 Published to PyPI: https://pypi.org/project/doculingo/"
          echo "🏷️ GitHub release: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.package-version.outputs.version }}"
