[project]
name = "doculingo"
version = "0.2.0"
description = "Tool to translate big documents using LLMs."
readme = "readme.md"
authors = [
    { name = "Leynier Gutiérrez González", email = "leynier41@gmail.com" },
]
license = "MIT"
license-files = ["license"]
keywords = ["document", "translation", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"

dependencies = [
    "openai>=1.31.0",
    "pydantic>=2.7.3",
    "typer>=0.12.5",
    "pydantic-settings>=2.3.0",
    "python-docx>=1.1.2",
]

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.2.1",
    "ruff>=0.4.7",
]

[project.scripts]
doculingo = "doculingo.main:app"

[project.urls]
homepage = "https://github.com/leynier/doculingo"
documentation = "https://github.com/leynier/doculingo"
repository = "https://github.com/leynier/doculingo"
issues = "https://github.com/leynier/doculingo/issues"
changelog = "https://github.com/leynier/doculingo/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doculingo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "docx.*"
ignore_missing_imports = true
